# Alembic configuration.
#
# The database URL is deliberately absent: it is resolved at runtime from
# `Settings` in migrations/env.py, so migrations and the application can never
# disagree about which database they are pointing at.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os

# Timestamped, ordered filenames -- `ls` shows migration history in the order
# it actually happened.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
