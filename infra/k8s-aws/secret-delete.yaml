# Removes the base's placeholder Secret from this overlay's output entirely.
#
# The base commits `app-secrets` with placeholder values so that `kubectl apply -k
# infra/k8s` works on a fresh cluster with no manual step -- good for kind, and a
# live-ammunition hazard here. Without this deletion, the sequence
#
#   1. create the real secret on the server, with working API keys
#   2. kubectl apply -k infra/k8s-aws
#
# would quietly overwrite step 1 with `POSTGRES_PASSWORD: change-me-in-a-real-
# deployment` and empty provider keys. Nothing errors: the pods restart, Postgres
# rejects the new password, and the providers vanish from the UI because the
# registry skips any provider with no key. Three unrelated-looking symptoms, one
# cause, and `kubectl get secret` shows an object that exists and looks fine.
#
# So the overlay does not manage secrets at all. They are created once, out of
# band, and every subsequent `apply` leaves them untouched. See docs/DEPLOY-AWS.md.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: llm-logger
$patch: delete
