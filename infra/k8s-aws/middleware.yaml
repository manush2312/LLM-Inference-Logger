# Traefik-based ingress, replacing the base manifest's nginx one.
#
# This is a full replacement rather than a patch because the difference is not
# cosmetic: the base carries `nginx.ingress.kubernetes.io/proxy-buffering: "off"`,
# which is load-bearing there -- with buffering on, nginx holds the whole SSE
# response and delivers it in one lump, so streaming silently stops streaming.
# Those annotations are inert under Traefik. Traefik v3 does not buffer responses
# by default, so the behaviour is correct here without an equivalent, but that is
# a property of Traefik rather than something this manifest configures, and it is
# worth knowing which of the two is true when streaming next looks wrong.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: llm-logger
spec:
  rateLimit:
    # Per client IP. The site is deliberately open -- no password -- so this is
    # the only thing standing between a scraper and either the free-tier provider
    # quota or Ollama pegging both vCPUs and making the site unusable for a real
    # visitor. Generous enough that a human clicking around never notices.
    average: 20
    period: 1m
    burst: 10

# There is deliberately no timeout middleware here.
#
# A `Middleware` with `spec.forwardingTimeouts` was the first attempt and is
# invalid -- the API server rejects it with `unknown field
# "spec.forwardingTimeouts"`, because that field belongs to the ServersTransport
# CRD, not Middleware. Worse than merely failing: the Ingress still referenced the
# middleware by name, so Traefik had a route pointing at a middleware that did not
# exist and refused to serve it.
#
# It turned out to be unnecessary. The fear was Traefik cutting off a long
# generation the way nginx's 60s default does, but Traefik v3 defaults its
# entryPoint readTimeout and writeTimeout to 0, meaning no limit. So streams of any
# duration survive without configuration. If a limit is ever introduced, the right
# place is the entryPoint or a ServersTransport -- not a Middleware.
