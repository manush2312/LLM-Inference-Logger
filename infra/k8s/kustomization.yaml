apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-logger

resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 02-postgres.yaml
  - 03-redis.yaml
  - 04-migrate-job.yaml
  - 05-backend.yaml
  - 06-worker.yaml
  - 07-frontend.yaml

# `labels` rather than the deprecated `commonLabels`.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: llm-inference-logger

# Tag centrally so a deploy is a one-line change here rather than an edit across
# three manifests. `:dev` is what `make kind-load` pushes into the kind node.
images:
  - name: llm-inference-logger-backend
    newTag: dev
  - name: llm-inference-logger-frontend
    newTag: dev
