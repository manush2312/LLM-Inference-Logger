# Postgres as a StatefulSet.
#
# A Deployment with a PVC would let a rolling update start a second pod that
# attaches the same volume -- two postmasters on one data directory, which is
# corruption, not contention. A StatefulSet with `volumeClaimTemplates` gives
# stable identity and ordered replacement.
#
# For a real deployment this should be a managed database (RDS, Cloud SQL). This
# manifest exists so the stack is self-contained and demonstrable on a laptop;
# running your own primary means owning backups, PITR, failover and version
# upgrades, which is a full-time concern rather than a YAML file.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: llm-logger
spec:
  # Headless: clients resolve the pod directly. There is one primary, so there
  # is nothing to load-balance across, and a stable DNS name is what the app
  # needs.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: llm-logger
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_DB }
            # The image refuses to initialise into a non-empty directory, and a
            # mounted PVC always contains `lost+found`. Initialising into a
            # subdirectory is the documented way around it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
