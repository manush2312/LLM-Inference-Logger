# Local cluster for testing these manifests.
#
# Every Makefile target that touches Kubernetes passes `--context kind-llm-logger`
# explicitly. That is not decoration: a developer's active context is frequently
# a real cluster, and an unqualified `kubectl apply` would land there. Pinning
# the context in the tooling means the safe thing happens by default rather than
# by remembering.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-logger
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Labels the node so the ingress-nginx controller will schedule here.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
