# The whole system, one command:
#
#   make up          # or: docker compose -f infra/docker-compose.yml up --build
#
# Five services. `backend` and `worker` are the *same image* with different
# commands -- they share the app package, so the event contract and ORM models
# are imported rather than duplicated, and producer and consumer cannot drift.
#
# Migrations run as a one-shot `migrate` service that both app services wait on,
# rather than at container start. Two API replicas starting at once would
# otherwise both try to migrate, and concurrent Alembic runs on one database is
# a race worth designing out rather than hoping about.

name: llm-inference-logger

x-app-env: &app-env
  APP_ENV: docker
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # JSON in containers: these logs are read by a collector, not a human.
  LOG_FORMAT: json
  POSTGRES_USER: ${POSTGRES_USER:-llm}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm}
  POSTGRES_DB: ${POSTGRES_DB:-llm_logger}
  # Service names, not localhost -- compose's DNS resolves these.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  EVENT_BUS_BACKEND: redis
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-mock}
  REDACTION_ENABLED: ${REDACTION_ENABLED:-true}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  DEFAULT_GROQ_MODEL: ${DEFAULT_GROQ_MODEL:-llama-3.3-70b-versatile}
  DEFAULT_GEMINI_MODEL: ${DEFAULT_GEMINI_MODEL:-gemini-2.0-flash}
  OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
  DEFAULT_OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-llama3.2}
  # Not `localhost` -- inside a container that is the container itself. Ollama
  # runs on the host, so the containers have to be told where the host is.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}

x-app-build: &app-build
  build:
    context: ../backend
    dockerfile: Dockerfile
  # Docker Desktop provides host.docker.internal automatically; Linux does not,
  # so it is mapped explicitly. Harmless where it already exists.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm}
      POSTGRES_DB: ${POSTGRES_DB:-llm_logger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Depending services wait on this, so "container started" is never
      # mistaken for "accepting connections".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm} -d ${POSTGRES_DB:-llm_logger}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: the stream is the buffer that protects ingestion from a Postgres
    # outage, so it should survive a Redis restart too.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot. Runs to completion, then both app services start.
  migrate:
    <<: *app-build
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app-build
    environment: *app-env
    command: ["llm-api"]
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness, not readiness: a Postgres blip must not make Docker restart
      # the API in a loop and turn a recoverable dependency failure into a
      # total one.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  worker:
    <<: *app-build
    environment: *app-env
    command: ["llm-worker"]
    restart: unless-stopped
    # Scales independently of the API: `docker compose up -d --scale worker=3`
    # works unchanged, because Redis consumer groups hand each entry to exactly
    # one consumer with no coordination code of ours.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Graceful shutdown: the worker finishes and acks its in-flight batch on
    # SIGTERM. The default 10s is enough for a batch but not for a hung write.
    stop_grace_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
