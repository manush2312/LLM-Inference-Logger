name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    # Integration-marked tests need real Postgres and Redis. Unit tests do not,
    # which is the point -- they run first and fail fast.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: llm
          POSTGRES_PASSWORD: llm
          POSTGRES_DB: llm_logger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llm -d llm_logger"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --directory backend --extra dev --frozen

      - name: Lint
        run: make lint

      - name: Type check
        run: make types

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-all
        env:
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    # Skipped until the frontend lands in M2.
    if: ${{ hashFiles('frontend/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
