name: Publish images

# Builds both images and pushes them to GHCR, so the cluster pulls a real
# registry tag instead of an image side-loaded with `kind load`.
#
# Building here rather than on the server is deliberate: the t3.medium has 2
# shared vCPUs and 4 GB, and `npm ci` plus `uv sync` on that box competes with the
# running application for the little memory it has.

on:
  push:
    branches: [main]
    # Docs-only commits should not rebuild and republish images.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the automatic GITHUB_TOKEN. Without it the
      # push fails with a 403 that reads like a credentials problem.
      packages: write

    strategy:
      # Both images are independent; a frontend failure should not mask whether
      # the backend built.
      fail-fast: false
      matrix:
        include:
          - name: llm-inference-logger-backend
            context: ./backend
          - name: llm-inference-logger-frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # `main` is what the overlay pins for a first deploy; the SHA tag is
          # what you pin to deploy a known build and to roll back to one.
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry: without it every push rebuilds the
          # dependency layers, which is the slow part of both images.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # linux/amd64 only. The target is a t3.medium (x86); adding arm64 here
          # roughly doubles build time for an image nothing pulls. If the instance
          # ever moves to a t4g, add linux/arm64 to this line -- that is the only
          # change needed on this side.
          platforms: linux/amd64
